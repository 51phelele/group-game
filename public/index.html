<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Check - The Party Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="card">
        <h1 class="logo">VIBE CHECK</h1>
        <p class="tagline">The answer that hits different wins.</p>
        <div class="home-buttons">
          <button class="btn btn-primary" onclick="showScreen('screen-create')">Create Game</button>
          <button class="btn btn-secondary" onclick="showScreen('screen-join')">Join Game</button>
        </div>
      </div>
    </div>

    <!-- CREATE ROOM -->
    <div id="screen-create" class="screen">
      <div class="card">
        <h2>Create a Game</h2>
        <input type="text" id="admin-name" placeholder="Your name" maxlength="20" autocomplete="off">
        <button class="btn btn-primary" onclick="createRoom()">Start Room</button>
        <button class="btn btn-back" onclick="showScreen('screen-home')">Back</button>
      </div>
    </div>

    <!-- JOIN ROOM -->
    <div id="screen-join" class="screen">
      <div class="card">
        <h2>Join a Game</h2>
        <input type="text" id="join-code" placeholder="Room code" maxlength="4" autocomplete="off" style="text-transform:uppercase">
        <input type="text" id="join-name" placeholder="Your name" maxlength="20" autocomplete="off">
        <button class="btn btn-primary" onclick="joinRoom()">Join</button>
        <button class="btn btn-back" onclick="showScreen('screen-home')">Back</button>
        <p id="join-error" class="error"></p>
      </div>
    </div>

    <!-- LOBBY (Admin view) -->
    <div id="screen-lobby" class="screen">
      <div class="card wide">
        <div class="room-code-display">
          <span class="label">Room Code</span>
          <span class="code" id="lobby-code"></span>
          <div id="lobby-qr" class="qr-container"></div>
          <span class="qr-hint">Scan to join</span>
        </div>
        <h2>Players</h2>
        <div id="player-list" class="player-list"></div>
        <div id="admin-controls">
          <textarea id="question-input" placeholder="Type your question..." rows="2" maxlength="200"></textarea>
          <button class="btn btn-primary" onclick="startQuestion()">Ask the Room</button>
        </div>
      </div>
    </div>

    <!-- WAITING (Player in lobby) -->
    <div id="screen-waiting" class="screen">
      <div class="card wide">
        <div class="room-code-display">
          <span class="label">Room Code</span>
          <span class="code" id="waiting-code"></span>
        </div>
        <h2>Players</h2>
        <div id="waiting-player-list" class="player-list"></div>
        <p class="waiting-text">Waiting for the host to ask a question...</p>
      </div>
    </div>

    <!-- ANSWERING -->
    <div id="screen-answer" class="screen">
      <div class="card wide">
        <div class="question-display">
          <span class="round-badge" id="round-badge">Round 1</span>
          <h2 id="answer-question"></h2>
        </div>
        <textarea id="answer-input" placeholder="Type your answer..." rows="2" maxlength="150"></textarea>
        <button class="btn btn-primary" id="submit-answer-btn" onclick="submitAnswer()">Lock In</button>
        <div id="answer-status" class="status"></div>
        <button class="btn btn-small btn-secondary" id="force-vote-btn" style="display:none" onclick="forceVoting()">Skip to Voting</button>
      </div>
    </div>

    <!-- VOTING -->
    <div id="screen-vote" class="screen">
      <div class="card wide">
        <div class="question-display">
          <h2 id="vote-question"></h2>
        </div>
        <div id="vote-options" class="vote-options"></div>
        <div id="vote-status" class="status"></div>
        <button class="btn btn-small btn-secondary" id="force-results-btn" style="display:none" onclick="forceResults()">Skip to Results</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div id="screen-results" class="screen">
      <div class="card wide">
        <h2 id="results-question"></h2>
        <div id="results-list" class="results-list"></div>
        <h3>Scoreboard</h3>
        <div id="scoreboard" class="scoreboard"></div>
        <button class="btn btn-primary" id="next-round-btn" style="display:none" onclick="nextRound()">Next Round</button>
        <p id="results-waiting" class="waiting-text">Waiting for host...</p>
      </div>
    </div>

    <!-- ROOM CLOSED -->
    <div id="screen-closed" class="screen">
      <div class="card">
        <h2>Room Closed</h2>
        <p>The host has left the game.</p>
        <button class="btn btn-primary" onclick="location.reload()">Back to Home</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
